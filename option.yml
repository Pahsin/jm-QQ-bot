# jmcomic 下载配置文件
# 参考：https://github.com/hect0x7/JMComic-Crawler-Python

# ---- 下载目录规则 ----
dir_rule:
  # 所有下载内容保存到 jm-qq-bot 下的 downloads 目录
  base_dir: downloads
  # 目录命名规则：Bd_Aid 表示按「本子ID」建文件夹
  rule: Bd_Aid

# ---- 下载行为 ----
download:
  image:
    # 图片格式：默认原图，可改为 .png / .webp
    suffix: .jpg
  threading:
    # 同时下载的章节数
    album: 2
    # 同时下载的图片数
    image: 4

# ---- 网络请求（可选）----
# 如果禁漫域名在你的网络下无法访问，可在此配置代理
# 代理示例（HTTP 代理）：
# client:
#   domain:
#     - 18comic.vip
#     - 18comic.org
#   proxies:
#     http://: http://127.0.0.1:7890
#     https://: http://127.0.0.1:7890
